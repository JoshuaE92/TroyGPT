<!-- templates/index.html (Corrected) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Let Me In – The Trojan Horse AI Game</title>

  <!-- Styles and Fonts -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game-container">
    <div id="game-info">
      <span id="day-counter">Day: {{ session.get('day', 1) }}</span>
      <span id="guard-counter">Guard: {{ session.get('guard_level', 1) }}/3</span>
    </div>

    <div id="character-portrait-container">
      <img id="character-portrait"
           src="{{ url_for('static', filename='images/' + session.chat_history[0]['portrait'].split('/')[-1]) }}"
           alt="Character Portrait" />
    </div>

    <div id="dialogue-container">
      <div id="speaker-name-tag">
        <span id="speaker-name">{{ session.chat_history[0]['name'] }}</span>
      </div>
      <div id="dialogue-box">
        <p id="dialogue-text">{{ session.chat_history[0]['content'] }}</p>
        <div id="typing-indicator" class="hidden">...</div>
      </div>
    </div>

    <div id="input-container">
      <input type="text" id="player-input" placeholder="Type your response..." autocomplete="off" />
      <button id="send-btn">Send</button>
    </div>

    <div id="game-over-screen" class="hidden">
      <h1 id="game-over-title"></h1>
      <p id="game-over-text"></p>
      <button id="restart-btn">Try Again</button>
    </div>
  </div>

  <!-- Pass initial game state from Flask to JavaScript -->
<script>
  const initialGameState = JSON.parse(`{{ {
    "day": session.get("day", 1),
    "guard_level": session.get("guard_level", 1),
    "game_state": session.get("game_state", "playing"),
    "initial_dialogue": session.get("chat_history", [{}])[0]
  } | tojson | safe }}`);
</script>


  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
